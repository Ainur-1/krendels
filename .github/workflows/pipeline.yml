# тесты -> сборка. Тесты пропускают всё остальное: `needs` не запустит задачу, чья
# зависимость упала, поэтому из коммита с красными тестами ничего не публикуется.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Второй пуш в ту же ветку делает первый неактуальным, поэтому он отменяется, а не
# доходит до конца и публикует устаревший образ.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Для каждого вызова uv в этой задаче, а не только для первого. Иначе голый
    # `uv run` прочитает .python-version, найдёт другой интерпретатор, пересоберёт
    # окружение без набора для разработки, и ветка матрицы молча перестанет проверять
    # ту версию, в честь которой названа.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --extra dev

      - run: uv run ruff check src tests scripts

      # В набор входит сверка с reference/geometry.py — та самая проверка, которая
      # имеет значение: положения до 1e-13 км и точное совпадение составов связей.
      - run: uv run pytest

      # Отчёты, на которые ссылаются документы, пересчитываются и сравниваются:
      # правка, молча сдвигающая опубликованное число, падает здесь, а не на защите.
      # Сверяются 276 значений — всё, на что ссылаются README и docs/findings.md.
      # Процессов два, а не восемь: это заодно проверяет, что число процессов на
      # результат не влияет.
      - name: Отчёты воспроизводятся
        if: matrix.python-version == '3.12'
        run: |
          uv run python scripts/make_report.py --out /tmp/metrics --workers 2
          uv run python scripts/check_report.py /tmp/metrics

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  image:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа Docker обязано быть в нижнем регистре, а репозиторий называется
      # Ainur-1/krendels, поэтому ${{ github.repository }} нельзя подставить в тег
      # напрямую: buildx отвергает такое с ошибкой про нижний регистр.
      - name: Имя образа в нижний регистр
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Помечается и хешем коммита, и latest: выкладка называет ровно то, что
      # выкладывает, а откату есть на что показать.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Ключ root добавляется на сервер один раз руками, приватная половина лежит
      # в секрете репозитория и до сервера не доезжает.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Имя образа в нижний регистр
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Запуск нового образа
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@161.104.53.181 <<'EOF'
            set -e
            docker pull "${{ steps.image.outputs.name }}:latest"
            docker rm -f krendels || true
            docker run -d --name krendels --restart unless-stopped \
              -p 8000:8000 "${{ steps.image.outputs.name }}:latest"
            sleep 5
            curl -fsS http://127.0.0.1:8000/api/health || exit 1
          EOF
