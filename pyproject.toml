[project]
name = "cosmo-net"
version = "0.1.0"
description = "Designs a LEO constellation and measures end-to-end reachability from northern ground terminals to a gateway"
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Основной набор — ровно то, что импортирует работающий сервис. Интерфейс собирается
# заранее в статические файлы и отдаётся через FastAPI, поэтому Node в контейнере не
# нужен и ничто отсюда его не притягивает.
#
# numpy своё место отрабатывает: прогон — это 720 отсчётов по 48 аппаратов, и вся
# траектория считается одним массивом (720, 48, 3), а не 34 560 скалярными
# вычислениями. Прототип на чистом Python, которым получены базовые числа, тратил
# 0.2 с на прогон — этого достаточно, чтобы быть правым, но не достаточно для подбора
# конфигурации, где за одним нажатием происходит сотня прогонов.
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Графики разведочного анализа. Отдельным набором, потому что сервису они не нужны:
# matplotlib — это десятки мегабайт, которые в контейнере никогда не импортируются.
figures = [
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmo_net"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Оба приходят от TestClient из starlette, а не от чего-либо в этом проекте, и
# сделать с ними здесь нечего.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore::UserWarning",
]
